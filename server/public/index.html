<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Wallet — Self-Guarding Autonomous Wallet</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --muted: #8b93a7;
    --green: #2ecc71;
    --red: #e74c3c;
    --amber: #f1c40f;
    --blue: #4aa8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; line-height: 1.5; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .kv code { font-size: 12px; word-break: break-all; color: #b9c2d6; }
  button {
    background: var(--blue);
    color: #06121f;
    border: 0;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  .plan {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .plan.approved { border-left-color: var(--green); }
  .plan.rejected { border-left-color: var(--red); }
  .plan.recovered { border-left-color: var(--amber); }
  .plan h3 { margin: 0 0 8px; font-size: 15px; }
  .plan .meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .plan .meta b { color: var(--text); font-weight: 600; }
  .tag {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .tag.green { background: rgba(46, 204, 113, 0.15); color: var(--green); }
  .tag.red { background: rgba(231, 76, 60, 0.15); color: var(--red); }
  .tag.amber { background: rgba(241, 196, 15, 0.15); color: var(--amber); }
  .log {
    background: #0b0d12;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: #b9c2d6;
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
    margin-top: 10px;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .status { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Agent Wallet</h1>
  <div class="sub">
    Self-guarding autonomous on-chain wallet.<br>
    <b>Planner</b> proposes · <b>Guardian</b> decides · <b>Contract</b> enforces.
  </div>

  <div class="card">
    <div class="kv" id="config"></div>
  </div>

  <div class="card">
    <div class="row">
      <button id="run">Run Demo</button>
      <span class="status" id="status">Ready.</span>
    </div>
  </div>

  <div id="results"></div>
</div>

<script>
  const $config = document.getElementById("config");
  const $results = document.getElementById("results");
  const $run = document.getElementById("run");
  const $status = document.getElementById("status");

  async function loadConfig() {
    const res = await fetch("/api/wallet");
    const data = await res.json();
    $config.innerHTML = `
      <div>RPC</div><div><code>${data.rpc}</code></div>
      <div>Wallet</div><div><code>${data.wallet}</code></div>
      <div>Token</div><div><code>${data.token}</code></div>
      <div>Recipient</div><div><code>${data.recipient}</code></div>
    `;
  }

  function renderPlan(plan) {
    const isRejected = plan.guardian && !plan.guardian.approved;
    const wasRecovered = plan.execution && plan.execution.ok && plan.execution.attempts > 1;
    const cls = isRejected ? "rejected" : wasRecovered ? "recovered" : "approved";

    let tagHtml;
    if (isRejected) tagHtml = `<span class="tag red">Rejected</span>`;
    else if (wasRecovered) tagHtml = `<span class="tag amber">Recovered</span>`;
    else tagHtml = `<span class="tag green">Executed</span>`;

    const guardianLine = plan.guardian
      ? (plan.guardian.approved ? "APPROVED" : "REJECTED") + (plan.guardian.reason ? " — " + plan.guardian.reason : "")
      : "—";

    const txLine = plan.execution && plan.execution.hash
      ? `<div class="meta">tx: <a href="https://localhost/explorer/${plan.execution.hash}" onclick="return false"><code>${plan.execution.hash}</code></a></div>`
      : "";

    const attemptsLog = plan.attempts && plan.attempts.length
      ? `<div class="log">${plan.attempts.join("\n")}</div>`
      : "";

    return `
      <div class="plan ${cls}">
        <h3>Plan #${plan.planId} ${tagHtml}</h3>
        <div class="meta"><b>Reason:</b> ${plan.reason}</div>
        <div class="meta"><b>Amount:</b> ${plan.amount}</div>
        <div class="meta"><b>Guardian:</b> ${guardianLine}</div>
        ${txLine}
        ${attemptsLog}
      </div>
    `;
  }

  async function runDemo() {
    $run.disabled = true;
    $status.textContent = "Running…";
    $results.innerHTML = "";

    try {
      const res = await fetch("/api/run", { method: "POST" });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "unknown error");
      $results.innerHTML = data.results.map(renderPlan).join("");
      $status.textContent = `Done — ${data.results.length} plans.`;
    } catch (err) {
      $status.textContent = "Error: " + err.message;
    } finally {
      $run.disabled = false;
    }
  }

  $run.addEventListener("click", runDemo);
  loadConfig();
</script>
</body>
</html>
